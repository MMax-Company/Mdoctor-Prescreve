<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel Médico - Doctor Prescreve</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }
    .container { max-width: 1400px; margin: 0 auto; }
    .header {
      background: white;
      padding: 30px;
      border-radius: 12px;
      margin-bottom: 30px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    .header h1 { color: #667eea; font-size: 28px; }
    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
      margin-bottom: 30px;
    }
    .stat-card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      text-align: center;
    }
    .stat-card h3 { color: #667eea; font-size: 32px; margin-bottom: 10px; }
    .stat-card p { color: #666; font-size: 14px; }
    .main-content {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
    }
    .card {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    .card h2 {
      color: #667eea;
      margin-bottom: 20px;
      font-size: 20px;
      border-bottom: 2px solid #667eea;
      padding-bottom: 10px;
    }
    .fila-list {
      max-height: 400px;
      overflow-y: auto;
    }
    .fila-item {
      padding: 15px;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      margin-bottom: 10px;
      cursor: pointer;
      transition: all 0.3s;
    }
    .fila-item:hover {
      background: #f5f5f5;
      border-color: #667eea;
    }
    .fila-item.active {
      background: #667eea;
      color: white;
      border-color: #667eea;
    }
    .fila-item h4 { margin-bottom: 5px; }
    .fila-item p { font-size: 13px; opacity: 0.8; }
    .prontuario-section {
      display: none;
    }
    .prontuario-section.active {
      display: block;
    }
    .info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin-bottom: 20px;
    }
    .info-item {
      padding: 10px;
      background: #f5f5f5;
      border-radius: 6px;
    }
    .info-item label { 
      display: block;
      font-weight: bold;
      color: #667eea;
      font-size: 12px;
      margin-bottom: 5px;
    }
    .textarea-group {
      margin-bottom: 20px;
    }
    .textarea-group label {
      display: block;
      font-weight: bold;
      color: #667eea;
      margin-bottom: 8px;
    }
    .textarea-group textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-family: Arial, sans-serif;
      font-size: 14px;
      min-height: 100px;
    }
    .action-buttons {
      display: flex;
      gap: 15px;
      margin-top: 20px;
    }
    .btn {
      flex: 1;
      padding: 14px 20px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s;
    }
    .btn-aprovar {
      background: #4CAF50;
      color: white;
    }
    .btn-aprovar:hover {
      background: #45a049;
    }
    .btn-reprovar {
      background: #f44336;
      color: white;
    }
    .btn-reprovar:hover {
      background: #da190b;
    }
    .btn-liberar {
      background: #FF9800;
      color: white;
    }
    .btn-liberar:hover {
      background: #e68900;
    }
    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: #999;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Painel Médico - Doctor Prescreve</h1>
      <p>Sistema de Atendimento Remoto</p>
    </div>

    <div class="stats">
      <div class="stat-card">
        <h3 id="total">0</h3>
        <p>Total</p>
      </div>
      <div class="stat-card">
        <h3 id="fila">0</h3>
        <p>Fila</p>
      </div>
      <div class="stat-card">
        <h3 id="aprovados">0</h3>
        <p>Aprovados</p>
      </div>
      <div class="stat-card">
        <h3 id="recusados">0</h3>
        <p>Recusados</p>
      </div>
    </div>

    <div class="main-content">
      <div class="card">
        <h2>Fila de Atendimentos</h2>
        <div id="fila-container" class="fila-list">
          <div class="empty-state">Carregando...</div>
        </div>
      </div>

      <div class="card">
        <div id="prontuario-vazio" class="empty-state">
          <p>Selecione um paciente</p>
        </div>

        <div id="prontuario-section" class="prontuario-section">
          <div class="info-grid">
            <div class="info-item">
              <label>Nome</label>
              <p id="paciente-nome">-</p>
            </div>
            <div class="info-item">
              <label>CPF</label>
              <p id="paciente-cpf">-</p>
            </div>
            <div class="info-item">
              <label>Telefone</label>
              <p id="paciente-telefone">-</p>
            </div>
            <div class="info-item">
              <label>Doença</label>
              <p id="paciente-doenca">-</p>
            </div>
          </div>

          <div class="textarea-group">
            <label>Observações (Opcional)</label>
            <textarea id="observacoes" placeholder="Digite suas observações..."></textarea>
          </div>

          <div class="action-buttons">
            <button class="btn btn-aprovar" onclick="aprovar()">Aprovar</button>
            <button class="btn btn-reprovar" onclick="reprovar()">Reprovar</button>
            <button class="btn btn-liberar" onclick="liberar()">Liberar</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    let atendimentoAtual = null;

    async function carregarEstatisticas() {
      try {
        const res = await fetch('/api/estatisticas');
        const data = await res.json();
        document.getElementById('total').textContent = data.totalAtendimentos || 0;
        document.getElementById('fila').textContent = data.fila || 0;
        document.getElementById('aprovados').textContent = data.aprovados || 0;
        document.getElementById('recusados').textContent = data.recusados || 0;
      } catch (e) {
        console.error('Erro:', e);
      }
    }

    async function carregarFila() {
      try {
        const res = await fetch('/api/fila');
        const data = await res.json();
        const container = document.getElementById('fila-container');
        
        if (!data.atendimentos || data.atendimentos.length === 0) {
          container.innerHTML = '<div class="empty-state">Nenhum paciente</div>';
          return;
        }

        container.innerHTML = data.atendimentos.map(at => 
          <div class="fila-item" onclick="selecionarAtendimento('')">
            <h4></h4>
            <p></p>
            <p></p>
          </div>
        ).join('');
      } catch (e) {
        console.error('Erro:', e);
      }
    }

    async function selecionarAtendimento(id) {
      try {
        const res = await fetch('/api/atendimento/' + id);
        const at = await res.json();
        atendimentoAtual = at;

        document.getElementById('paciente-nome').textContent = at.paciente_nome;
        document.getElementById('paciente-cpf').textContent = at.paciente_cpf;
        document.getElementById('paciente-telefone').textContent = at.paciente_telefone;
        document.getElementById('paciente-doenca').textContent = at.doencas;
        document.getElementById('observacoes').value = '';

        document.getElementById('prontuario-vazio').style.display = 'none';
        document.getElementById('prontuario-section').classList.add('active');
      } catch (e) {
        console.error('Erro:', e);
      }
    }

    async function aprovar() {
      if (!atendimentoAtual) return;
      try {
        await fetch('/api/decisao/' + atendimentoAtual.id, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ decisao: 'APROVAR' })
        });
        alert('Aprovado!');
        carregarFila();
        carregarEstatisticas();
        document.getElementById('prontuario-vazio').style.display = 'block';
        document.getElementById('prontuario-section').classList.remove('active');
      } catch (e) {
        console.error('Erro:', e);
      }
    }

    async function reprovar() {
      if (!atendimentoAtual) return;
      try {
        await fetch('/api/decisao/' + atendimentoAtual.id, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ decisao: 'RECUSAR' })
        });
        alert('Recusado!');
        carregarFila();
        carregarEstatisticas();
        document.getElementById('prontuario-vazio').style.display = 'block';
        document.getElementById('prontuario-section').classList.remove('active');
      } catch (e) {
        console.error('Erro:', e);
      }
    }

    async function liberar() {
      if (!atendimentoAtual) return;
      try {
        await fetch('/api/atendimento/' + atendimentoAtual.id + '/liberar', {
          method: 'POST'
        });
        alert('Liberado!');
        carregarFila();
        document.getElementById('prontuario-vazio').style.display = 'block';
        document.getElementById('prontuario-section').classList.remove('active');
      } catch (e) {
        console.error('Erro:', e);
      }
    }

    carregarEstatisticas();
    carregarFila();
    setInterval(() => {
      carregarEstatisticas();
      carregarFila();
    }, 10000);
  </script>
</body>
</html>
